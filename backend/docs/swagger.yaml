basePath: /
definitions:
  model.ErrorResponse:
    properties:
      errors: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  model.PathData:
    properties:
      grpc:
        type: string
      upgrade:
        type: string
      ws:
        type: string
    type: object
  model.PayloadWSData:
    properties:
      payloadcdn:
        type: string
      payloadwithpath:
        type: string
    type: object
  model.PortData:
