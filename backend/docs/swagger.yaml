      grpc:
        items:
          type: string
        type: array
      none:
        items:
          type: string
        type: array
      tls:
        items:
          type: string
        type: array
      udpgw:
        items:
          type: string
        type: array
    type: object
  model.RenewData:
    properties:
      from:
        type: string
      to:
        type: string
      username:
        type: string
    type: object
  model.SSHData:
    properties:
      city:
        type: string
      expired:
        type: string
      hostname:
        type: string
      isp:
        type: string
      password:
        type: string
      payload_ws:
        $ref: '#/definitions/model.PayloadWSData'
      port:
        $ref: '#/definitions/model.PortData'
      username:
        type: string
    type: object
  model.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  model.TrojanData:
    properties:
      city:
        type: string
      expired:
        type: string
      hostname:
        type: string
      isp:
        type: string
      link:
        $ref: '#/definitions/model.XrayLinkData'
      password:
        type: string
      path:
        $ref: '#/definitions/model.PathData'
      port:
        $ref: '#/definitions/model.PortData'
      username:
        type: string
    type: object
  model.VlessData:
