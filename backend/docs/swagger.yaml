info:
  contact: {}
  description: Selamat datang di dokumentasi API Neko Tunneling. Halaman ini berisi
    referensi endpoint lengkap untuk mempermudah integrasi VPS dengan Web Panel, skrip
    automasi, maupun Bot Telegram.
  title: Neko Tunneling API
  version: "1.0"
paths:
  /vps/create/ssh:
    post:
      consumes:
      - application/x-www-form-urlencoded
      parameters:
      - description: Username akun
        in: formData
        name: username
        required: true
        type: string
      - description: Pasword akun (akan dibuat random jika kosong)
        in: formData
        name: password
        type: string
      - description: Limit IP (unlimited jika kosong)
        in: formData
        name: limit_ip
        type: integer
      - description: Limit Quota (unlimited jika kosong)
        in: formData
        name: limit_quota
        type: integer
      - description: Durasi masa aktif (hari)
        in: formData
        name: expired
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            allOf:
            - $ref: '#/definitions/model.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.SSHData'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create Akun SSH
      tags:
      - Create Akun
